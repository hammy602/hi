<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings • Hi Games</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html">hi games</a><nav><a href="index.html">Games</a><a class="active" href="settings.html">Settings</a></nav></header>
<main class="page settings"><p class="eyebrow">SETTINGS</p><h1>Customize Hi Games</h1><p class="intro">Change the appearance and browsing preferences. Everything is saved on this device.</p>
<section class="card"><h2>Theme</h2><div class="theme-grid">
<button data-theme="dark">Dark</button><button data-theme="light">Light</button><button data-theme="violet">Violet</button><button data-theme="blue">Blue</button><button data-theme="green">Green</button><button data-theme="red">Red</button><button data-theme="amber">Amber</button><button data-theme="pink">Pink</button><button data-theme="gray">Gray</button><button data-theme="midnight">Midnight</button></div></section>
<section class="card"><h2>Accent color</h2><div class="accent-grid"><button data-accent="#7c5cff"></button><button data-accent="#3b82f6"></button><button data-accent="#22c55e"></button><button data-accent="#ef4444"></button><button data-accent="#f59e0b"></button><button data-accent="#ec4899"></button><button data-accent="#06b6d4"></button></div></section>
<section class="card"><h2>Game grid</h2><label>Games per page <select id="per-page"><option>24</option><option selected>36</option><option>48</option><option>60</option></select></label><label class="check"><input id="compact" type="checkbox"> Compact game cards</label></section>
<section class="card"><h2>Reset</h2><button id="reset" class="danger">Reset customization</button></section></main><script src="script.js"></script></body></html>
